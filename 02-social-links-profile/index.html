<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main>
      <img
        src="./assets/images/avatar-jessica.jpeg"
        alt="photo of Jessica Randall"
        class="avatar"
      />
      <h1>Jessica Randall</h1>
      <h3>London, United Kingdom</h3>
      <p>"Front-end developer and avid reader."</p>

      <div class="btns">
        <a href="https://github.com/" class="button">GitHub</a>
        <a href="https://www.frontendmentor.io/" class="button"
          >Frontend Mentor</a
        >
        <a href="https://www.linkedin.com/" class="button">LinkedIn</a>
        <a href="https://x.com/" class="button">Twitter</a>
        <a href="https://www.instagram.com/?hl=en" class="button">Instagram</a>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">danicamixolydian</a>.
    </footer>
  </body>
</html>
