<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <img
        src="./images/image-product-desktop.jpg"
        alt="an image of Gabrielle Chanel perfume"
        class="perfume-img"
      />

      <img
        src="./images/image-product-mobile.jpg"
        alt="an image of Gabrielle Chanel perfume"
        class="perfume-img-mobile"
      />

      <div class="product-details">
        <p class="perfume-text montserrat-500">PERFUME</p>
        <h1 class="fraunces-700">Gabrielle Essence Eau De Parfum</h1>
        <p class="product-description montserrat-500">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="product-price">
          <p class="fraunces-700">$149.99</p>
          <small class="montserrat-500">$169.99</small>
        </div>
        <button class="add-to-cart-btn montserrat-700">
          <img
            class="add-to-cart-icon"
            src="./images/icon-cart.svg"
            alt="add to cart icon"
          />Add to Cart
        </button>
      </div>
    </main>

    <footer class="attribution montserrat-500">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">danicamixolydian</a>.
    </footer>
  </body>
</html>
